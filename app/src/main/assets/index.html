<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Block Bikhon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: bright, juicy mobile puzzle — playful but tidy
   IDEA: a toy board whose bricks change material zone by zone; a classic glossy style too
   PICTURE: the 8x8 board of rendered blocks, tray, undo and illustrated bombs below
   COLOUR and TYPE: theme ground + navy board, per-pixel material textures; Rubik heavy numerals
   LAYOUT: one centred column — score, zone bar, board, tray, actions; home, rules, menu, game-over cards */
:root{color-scheme:dark;--bg1:#1fb3f0;--bg2:#0270b5;--board:#064a80;--slot:#0c5d9b;--ink:#fff;--card1:#12a2e2;--card2:#0673b7;--acc:#ffab20;--acc2:#c77a00;
--cell:min(44px,calc((100vw - 52px)/8 - 3px),calc((100dvh - 372px)/10.4));--gap:3px;--W:calc(var(--cell)*8 + var(--gap)*7 + 20px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));color:var(--ink);
font:16px/1.4 Rubik,Vazirmatn,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .4s}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8dvh,18px);padding:10px}
.top{width:var(--W);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.best{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;color:var(--acc)}
.best svg{width:26px;height:20px}
.score{font-weight:900;font-size:clamp(36px,6.5vh,54px);line-height:1;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .15s}
.score.bump{transform:scale(1.15)}
.btns{justify-self:end;display:flex;gap:8px}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:grid;place-items:center;font:900 20px Rubik,sans-serif}
.ib svg{width:22px;height:22px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.zonebar{width:var(--W);display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-top:-4px}
.zonebar img{width:22px;height:22px;border-radius:5px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.zprog{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.28);overflow:hidden}
.zprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff8a2a);transition:width .4s}
.zonebar small{opacity:.75;font-weight:500;white-space:nowrap}
.zonebar.endless .zprog{visibility:hidden}
.boardwrap{position:relative;padding:10px;border-radius:14px;background:var(--board);box-shadow:0 10px 0 rgba(0,0,0,.18),inset 0 0 0 2px rgba(255,255,255,.05);transition:background .4s,filter .3s}
.boardwrap.lit{filter:brightness(1.35)}
.board{display:grid;grid-template-columns:repeat(8,var(--cell));gap:var(--gap);touch-action:none}
.c{width:var(--cell);height:var(--cell);border-radius:6px;background-color:var(--slot);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);background-size:100% 100%;background-repeat:no-repeat}
.c.f,.c.g,.c.h{background-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.c.g{opacity:.5}
.c.h{filter:brightness(1.25) saturate(1.1)}
.c.pop{animation:pop .28s ease-in forwards}
@keyframes pop{0%{transform:scale(1);filter:brightness(2)}35%{transform:scale(1.15)}100%{transform:scale(.1);opacity:0}}
.c.morph{animation:morph .6s ease-out}
@keyframes morph{0%{transform:scale(.6) rotate(-10deg);filter:brightness(2.5)}60%{transform:scale(1.1)}100%{transform:none}}
.c.land{animation:land .22s ease-out}
@keyframes land{0%{transform:scale(1.18)}100%{transform:none}}
.b{background-size:100% 100%;background-repeat:no-repeat;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tray{width:var(--W);height:calc(var(--cell)*3.1);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));touch-action:none}
.slot{display:grid;place-items:center;cursor:grab}
.pc{display:grid;gap:2px}
.slot .b{width:calc(var(--cell)*.54);height:calc(var(--cell)*.54)}
.slot.no{opacity:.35}
.slot.drag .pc{visibility:hidden}
.e{visibility:hidden}
.float{position:fixed;left:0;top:0;display:grid;pointer-events:none;z-index:20;filter:drop-shadow(0 10px 8px rgba(0,0,0,.4))}
.float .b{border-radius:6px}
.float.back{transition:transform .2s ease-out}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
#flash{position:fixed;inset:0;background:#fff8e0;opacity:0;pointer-events:none;z-index:26}
.msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;font-weight:900;white-space:nowrap;z-index:2}
.msg div{animation:rise 1.2s ease-out forwards}
.msg .big{font-size:clamp(28px,6vh,44px);color:var(--acc);text-shadow:0 3px 0 #b5470b,0 6px 10px rgba(0,0,0,.4)}
.msg .pts{font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.msg .why{font-size:15px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@keyframes rise{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.1);opacity:1}75%{transform:translateY(-10px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.zb{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.zbc{background:rgba(8,10,30,.72);padding:16px 26px;border-radius:18px;text-align:center;animation:zin 2.6s forwards;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.zbc img{width:56px;height:56px;border-radius:10px;display:block;margin:0 auto 8px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.zbc b{display:block;font-size:14px;opacity:.8;font-weight:500}
.zbc span{font-size:30px;font-weight:900;color:var(--acc);text-shadow:0 3px 0 rgba(0,0,0,.35)}
@keyframes zin{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.hint{font-size:13px;opacity:.7;text-align:center;min-height:18px;max-width:var(--W)}
.hint.warn{opacity:1;color:var(--acc);font-weight:700}
/* actions */
.actions{display:flex;gap:14px;justify-content:center;align-items:center}
.bm,.ub{position:relative;width:62px;height:58px;border:0;border-radius:16px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),rgba(0,0,0,.22));cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.08);transition:background .2s}
.ub{width:54px;background:radial-gradient(circle at 50% 30%,#5fd8ff,#1f7fd1)}
.ub svg{width:30px;height:30px}
.bm svg{width:48px;height:48px;overflow:visible}
.bm .n,.ub .n{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:#ff4f5e;color:#fff;font:700 13px Rubik,sans-serif;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ub .n{background:#0d3f7a}
.bm.zero,.ub.off{opacity:.42;filter:grayscale(.7)}.bm.zero .n{background:#6b6f80}
.bm.arm{background:radial-gradient(circle,#fff3b0,#ffc21a);animation:pulse .7s infinite alternate}
.bm.got{animation:got .7s}
.actions.need .bm:not(.zero),.actions.need .ub:not(.off){animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.09)}}
@keyframes got{40%{transform:scale(1.4) rotate(-8deg)}}
.spark{animation:flick .12s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flick{to{transform:scale(1.25);opacity:.8}}
.flame{animation:flame .1s infinite alternate;transform-box:fill-box;transform-origin:right center}
@keyframes flame{to{transform:scaleX(1.3)}}
.tw{animation:tw 1.2s infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation-delay:.6s}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.3}50%{transform:scale(1);opacity:1}}
.c.x{box-shadow:inset 0 0 0 3px var(--acc),0 0 12px #ff8a2a;filter:brightness(1.35)}
.boardwrap.armed{box-shadow:0 10px 0 rgba(0,0,0,.18),0 0 0 3px var(--acc);cursor:crosshair}
.boardwrap.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(calc(var(--s)*-1px),calc(var(--s)*.5px))}30%{transform:translate(calc(var(--s)*1px),calc(var(--s)*-.5px))}50%{transform:translate(calc(var(--s)*-.6px),calc(var(--s)*-.4px))}70%{transform:translate(calc(var(--s)*.5px),calc(var(--s)*.3px))}85%{transform:translate(calc(var(--s)*-.2px),0)}}
/* overlays */
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,14,40,.62);z-index:30;padding:16px}
.ov.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{background:linear-gradient(var(--card1),var(--card2));border-radius:22px;padding:24px 22px;text-align:center;width:min(380px,100%);box-shadow:0 12px 0 rgba(0,0,0,.25);max-height:100%;overflow-y:auto}
.card h2{margin:0 0 6px;font-size:28px;font-weight:900}
.card .lbl{opacity:.8;font-size:15px;margin-top:14px}
.card .val{font-size:48px;font-weight:900;line-height:1.1}
.card .bv{color:var(--acc);font-size:24px;font-weight:700}
.card .nb{color:var(--acc);font-weight:700;margin-top:8px;display:none}
.big-b{margin-top:16px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:700 19px Rubik,Vazirmatn,sans-serif;cursor:pointer;box-shadow:0 5px 0 var(--acc2);text-shadow:0 1px 0 rgba(0,0,0,.2);display:block}
.big-b:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acc2)}
.big-b small{display:block;font:500 13px Rubik,sans-serif;opacity:.85}
.big-b.blue{background:#fff;color:#0274b8;box-shadow:0 5px 0 #a9d4f0;text-shadow:none}
.big-b.alt{background:rgba(255,255,255,.16);box-shadow:none;margin-top:10px;font-size:17px;min-height:46px}
.home h1{margin:6px 0 2px;font-size:40px;font-weight:900;color:var(--acc);text-shadow:0 4px 0 #b5470b,0 8px 14px rgba(0,0,0,.35)}
.logo{display:flex;justify-content:center;gap:4px;margin-top:4px}
.logo img{width:34px;height:34px;border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.logo img:nth-child(2){transform:translateY(-8px)}.logo img:nth-child(4){transform:translateY(-4px)}
.home p{margin:4px 0 6px;opacity:.85}
.rules{text-align:left}
.rules h2{text-align:center}
.rules h3{margin:18px 0 6px;font-size:17px;color:var(--acc)}
.rules p,.rules li{font-size:15px;line-height:1.5;margin:4px 0}
.rules ul{padding-inline-start:20px;margin:4px 0}
.rules table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.rules td,.rules th{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.15);text-align:start}
.rules td:last-child,.rules th:last-child{text-align:end;white-space:nowrap}
.rules .bi{display:flex;gap:10px;align-items:center;margin:8px 0}
.rules .bi svg{width:40px;height:40px;flex:none;overflow:visible}
.menu{text-align:left}
.menu h2{text-align:center}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:15px;font-weight:700;opacity:.85}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{border:0;border-radius:12px;padding:8px 4px 7px;background:rgba(0,0,0,.18);color:#fff;font:500 13px Rubik,Vazirmatn,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px}
.opt.sel{box-shadow:inset 0 0 0 3px var(--acc);background:rgba(0,0,0,.28)}
.sw{width:100%;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:3px}
.sw i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35)}
.opt img{width:36px;height:36px;border-radius:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.row span{font-weight:500}
.tg{width:56px;height:32px;border:0;border-radius:16px;background:rgba(0,0,0,.3);position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg::after{content:'';position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tg[aria-checked=true]{background:var(--acc)}
.tg[aria-checked=true]::after{transform:translateX(24px)}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg .opt{flex-direction:row;justify-content:center;font-size:14px}
.board,.tray,.pc,.float,.actions,.score{direction:ltr}
[lang=fa] body{font-family:Vazirmatn,Rubik,system-ui,sans-serif}
[dir=rtl] .rules,[dir=rtl] .menu{text-align:right}
.langs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.langs .opt{flex-direction:row;justify-content:center;font-size:13px;min-height:40px;padding:6px 2px}
#splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2cbaf7,#039de0 55%,#0276bd);overflow:hidden;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp{position:relative;display:flex;flex-direction:column;align-items:center;width:min(66vw,290px)}
.sp-e{position:relative;width:100%;animation:spE .8s cubic-bezier(.2,1.5,.4,1) both}
.sp-e img{position:relative;width:100%;display:block}
.sp-shine{position:absolute;inset:0;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:shine .75s 1s ease-in-out both}
.sp-ring{position:absolute;left:55%;top:52%;width:44%;aspect-ratio:1;border-radius:50%;border:7px solid #ffab20;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:ring .9s .3s ease-out both}
.sp-ring.r2{border-color:#fff;border-width:4px;animation-delay:.48s}
.sp-w{width:100%;margin-top:7%;animation:spW .55s .7s cubic-bezier(.2,1.4,.4,1) both}
.sp-t{width:94%;margin-top:4%;animation:spT .5s 1.05s ease-out both}
.sp-dot{position:absolute;left:55%;top:52%;border-radius:50%;opacity:0;animation:dot .9s ease-out both}
@keyframes spE{0%{transform:scale(.15) rotate(-16deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.2);opacity:.95}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
@keyframes spW{0%{transform:translateY(46px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes spT{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes shine{to{background-position:-60% 0}}
@keyframes dot{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
@media(prefers-reduced-motion:reduce){.sp-e,.sp-w,.sp-t,.sp-ring,.sp-shine,.sp-dot{animation-duration:.01s;animation-delay:0s}}
@media(max-height:640px){.hint{display:none}}
@media(prefers-reduced-motion:reduce){.c.pop,.c.morph,.boardwrap.shake{animation-duration:.01s}.msg div{animation-duration:.8s}}
</style>
<style id="txs"></style>
</head>

 <p><b>Бесконечная игра:</b> без зон. Вид блоков выбираете в меню (по умолчанию «Классика»). Сложность медленно растёт вместе с очками. Рекорд этого режима отдельный.</p>
 <h3>Бомбы</h3><p>Бомбы не даются просто так: их можно только заработать хорошей игрой. Каждого вида можно держать не больше 2.</p>

 rulesHtml:(z,B)=>`<h3>Goal</h3><p>Drag shapes onto the 8×8 board. A full row or column clears. When no shape fits anywhere, the game is over.</p>
 <h3>Points</h3><ul><li>Each placed cell: 1 point.</li><li>Lines at once: 1 line 10, 2 lines 40, 3 lines 90, 4 lines 160.</li><li>Combo: clear lines move after move for a bonus. If 3 shapes in a row clear nothing, the combo resets.</li><li>Completely empty board: +300.</li></ul>
 <h3>Modes</h3><p><b>Zone journey:</b> each zone needs more points, and higher zones bring big shapes more often.</p>${z}
 <p>After zone 8 the zones start again from Clay, 2000 points each.</p>
 <p><b>Endless game:</b> no zones. You pick the block style in the menu (Classic by default). Difficulty slowly rises with your score. This mode keeps its own record.</p>
 <h3>Bombs</h3><p>Bombs are never free: you earn them only by playing well. You can hold at most 2 of each kind.</p>
 <div class="bi">${B[0]}<div><b>3×3 Bomb</b> — clear 3 lines with one shape. Clears a 3×3 area.</div></div>
 <div class="bi">${B[1]}<div><b>Rocket</b> — reach combo 5, 10, 15… Clears the cell's row and column.</div></div>
 <div class="bi">${B[2]}<div><b>Color bomb</b> — clear 4 or more lines at once, or empty the whole board. Removes every block of one color.</div></div>
 <p>Each block removed by a bomb gives 2 points.</p>
 <h3>Undo</h3><p>Placed a shape in the wrong spot? Press <b>↶</b>. Only the last move is undone (one step). 3 times per game. Points and bombs earned by that move are taken back too. It also works after the game ends.</p>`},

 <h3>امتیاز</h3><ul><li>هر خانهٔ گذاشته‌شده: ۱ امتیاز.</li><li>چند ردیف یک‌جا: ۱ ردیف ۱۰، ۲ ردیف ۴۰، ۳ ردیف ۹۰، ۴ ردیف ۱۶۰.</li><li>کمبو: اگر پشت سر هم ردیف پاک کنید، امتیاز اضافه می‌گیرید. اگر ۳ شکل پشت سر هم ردیفی پاک نکنند، کمبو صفر می‌شود.</li><li>صفحهٔ کاملاً خالی: ۳۰۰+.</li></ul>
 <h3>حالت‌ها</h3><p><b>سفر منطقه‌ها:</b> هر منطقه امتیاز بیشتری می‌خواهد و در منطقه‌های بالاتر شکل‌های بزرگ بیشتر می‌آیند.</p>${z}
 <p>پس از منطقهٔ ۸، منطقه‌ها دوباره از گِل شروع می‌شوند، هر کدام ۲۰۰۰ امتیاز.</p>
 <p><b>بازی بی‌پایان:</b> بدون منطقه. نوع بلوک را از منو انتخاب می‌کنید (پیش‌فرض کلاسیک). سختی با بالا رفتن امتیاز کم‌کم بیشتر می‌شود. رکورد این حالت جداست.</p>
 <h3>بمب‌ها</h3><p>بمب‌ها رایگان داده نمی‌شوند؛ فقط با بازی خوب به دست می‌آیند. از هر نوع حداکثر ۲ تا نگه داشته می‌شود.</p>
 <div class="bi">${B[0]}<div><b>بمب ۳×۳</b> — با یک شکل ۳ ردیف را یک‌جا پاک کنید. محدودهٔ ۳×۳ را پاک می‌کند.</div></div>
 <div class="bi">${B[1]}<div><b>موشک</b> — به کمبوی ۵، ۱۰، ۱۵… برسید. ردیف و ستون آن خانه را پاک می‌کند.</div></div>
 <div class="bi">${B[2]}<div><b>بمب رنگی</b> — ۴ ردیف یا بیشتر را یک‌جا پاک کنید یا کل صفحه را خالی کنید. همهٔ بلوک‌های یک رنگ را پاک می‌کند.</div></div>
 <p>هر بلوکی که با بمب پاک شود ۲ امتیاز دارد.</p>
 <h3>برگشت</h3><p>اگر شکل را اشتباه گذاشتید، دکمهٔ <b>↶</b> را بزنید. فقط آخرین حرکت برمی‌گردد (یک قدم). در هر بازی ۳ بار. امتیاز و بمبی که با آن حرکت گرفتید هم برمی‌گردد. بعد از پایان بازی هم کار می‌کند.</p>`}};

  case'silver':for(let i=0;i<n(6);i++)addP({s:'shard',x:cx+sp(z*.5),y:cy+sp(z*.5),vx:sp(420),vy:up(150,430),z:z*(.12+R()*.13),c:shade(c,sp(.45)),vr:sp(22),g:1100,max:.95});for(let i=0;i<n(6);i++)addP({s:'spark',x:cx+sp(z),y:cy+sp(z),vx:sp(160),vy:up(20,160),z:z*.22,c:'#ffffff',g:120,max:.65});break;
  case'gold':for(let i=0;i<n(5);i++)addP({s:'coin',x:cx+sp(z*.4),y:cy+sp(z*.4),vx:sp(340),vy:up(260,540),z:z*.16,vr:8+R()*8,g:1300,max:1.2});for(let i=0;i<n(6);i++)addP({s:'spark',x:cx+sp(z),y:cy+sp(z),vx:sp(170),vy:up(20,170),z:z*.24,c:'#ffe680',g:120,max:.75});break;
  case'crystal':{const pal=PALS[set.pal].c;for(let i=0;i<n(9);i++)addP({s:'shard',x:cx+sp(z*.5),y:cy+sp(z*.5),vx:sp(500),vy:up(150,500),z:z*(.12+R()*.15),c:pal[Math.floor(R()*8)],vr:sp(25),g:1000,max:.95});for(let i=0;i<n(7);i++)addP({s:'spark',x:cx+sp(z),y:cy+sp(z),vx:sp(190),vy:up(20,190),z:z*.22,c:pal[Math.floor(R()*8)],g:100,max:.75});break}}}
function landFx(m,rect,k){const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,z=rect.width;
  if(['silver','gold','crystal','ice','classic'].includes(m.id)){if(R()<.5)addP({s:'spark',x:cx+(R()-.5)*z,y:cy+(R()-.5)*z,vx:0,vy:0,z:z*.18,c:'#fff',g:0,max:.35})}
  else addP({s:'dust',x:cx,y:rect.bottom,vx:(R()-.5)*60,vy:-10,z:z*.15,c:m.id==='stone'?'#b5b5b5':shade(baseCol(m,k),.3),g:-10,max:.45})}
function metrics(){const a=cells[0].getBoundingClientRect(),b=cells[1].getBoundingClientRect();return{x:a.left,y:a.top,pitch:b.left-a.left,size:a.width}}
function beams(rows,cols,c){const m=metrics(),W=N*m.pitch-(m.pitch-m.size);
  rows.forEach(r=>addP({s:'beam',x:m.x+W/2,y:m.y+r*m.pitch+m.size/2,len:W+m.pitch*.8,th:m.size*.55,c,rot:0,vr:0,vx:0,vy:0,g:0,max:.5}));
  cols.forEach(cc=>addP({s:'beam',x:m.x+cc*m.pitch+m.size/2,y:m.y+W/2,len:W+m.pitch*.8,th:m.size*.55,c,rot:Math.PI/2,vr:0,vx:0,vy:0,g:0,max:.5}))}
function explode3(rect){const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,z=rect.width;
  addP({s:'glow',x:cx,y:cy,vx:0,vy:0,z:z*5,c:'#ffb040',g:0,rot:0,max:.5});
  addP({s:'ring',x:cx,y:cy,vx:0,vy:0,z:z*4,c:'rgba(255,255,255,.95)',g:0,max:.4});
  setTimeout(()=>addP({s:'ring',x:cx,y:cy,vx:0,vy:0,z:z*3,c:'rgba(255,150,40,.9)',g:0,max:.5}),80);
  for(let i=0;i<(RM?5:18);i++){const a=R()*7,v=90+R()*300;addP({s:'fire',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,z:z*(.28+R()*.28),g:-60,drag:3,max:.45+R()*.3})}
  for(let i=0;i<(RM?6:26);i++){const a=-Math.PI*R(),v=200+R()*450;addP({s:'ember',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,z:2+R()*2.5,g:650,drag:.6,max:1+R()*.6})}
  for(let i=0;i<(RM?2:9);i++){const a=R()*7,v=40+R()*130;addP({s:'smoke',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,z:z*.32,c:'#33333c',g:-45,drag:2,max:1.3})}
  flash(.6,.4);shake(11);boardLight()}

/* ---------- theme / zone UI ---------- */
function applyTheme(){const t=THEMES[set.theme],r=document.documentElement.style;
  r.setProperty('--bg1',t.bg1);r.setProperty('--bg2',t.bg2);r.setProperty('--board',t.board);r.setProperty('--slot',t.slot);r.setProperty('--card1',t.c1);r.setProperty('--card2',t.c2)}
function zoneUI(){const m=mat();$('zimg').src=TEX[4];$('zonebar').classList.toggle('endless',mode==='endless');
  if(mode==='endless'){$('zname').textContent=tr('endlessBar')+' · '+mName(m);$('znext').textContent='';return}
  $('zname').textContent=`${tr('zone',zone+1)} · ${mName(m)}`;const a=zoneStart(zone),b=zoneStart(zone+1);
  $('zfill').style.width=Math.min(100,(score-a)/(b-a)*100)+'%';
  $('znext').textContent=set.mat==='auto'?`→ ${mName(ZMATS[(zone+1)%8])} (${b})`:`→ ${b}`}
function checkZone(){if(mode!=='zones'){zoneUI();return}const z=zoneOfScore(score);if(z===zone){zoneUI();return}
  const up=z>zone;zone=z;buildTex();render(true);renderTray();
  if(up){$('zb').innerHTML=`<div class="zbc"><img src="${TEX[4]}" alt=""><b>${tr('zone',zone+1)}</b><span>${mName(mat())}</span></div>`;play('zone');setTimeout(()=>{$('zb').innerHTML=''},2700)}
  zoneUI()}

/* ---------- game ---------- */
const rnd=n=>Math.floor(R()*n);
function fits(sh,r,c){for(const[a,b]of sh.cells){const r2=r+a,c2=c+b;if(r2<0||c2<0||r2>=N||c2>=N||grid[r2*N+c2])return false}return true}
function fitsAny(sh){for(let r=0;r<=N-sh.h;r++)for(let c=0;c<=N-sh.w;c++)if(fits(sh,r,c))return true;return false}
function difficulty(){if(mode==='endless')return Math.min(.85,score/7000);const a=zoneStart(zone),b=zoneStart(zone+1);return Math.min(1,zone*.14+(score-a)/(b-a)*.12)}
function pickShape(D){const w=SHAPES.map(sh=>{const n=sh.cells.length;return n<=3?1.25-.8*D:n===4?1:n<=6?.55+.8*D:.3+.75*D});
  let t=w.reduce((a,b)=>a+b,0)*R();for(let i=0;i<w.length;i++){t-=w[i];if(t<=0)return i}return 0}
function newTray(){const D=difficulty();let t,ok=false;
  if(D<.25)for(let k=0;k<30&&!ok;k++){t=[0,1,2].map(()=>({s:pickShape(D),k:1+rnd(8)}));ok=t.every(p=>fitsAny(SHAPES[p.s]))}
  for(let k=0;k<40&&!ok;k++){t=[0,1,2].map(()=>({s:pickShape(D),k:1+rnd(8)}));ok=t.some(p=>fitsAny(SHAPES[p.s]))}
  tray=t}
function save(){ls.set('bp_state',JSON.stringify({v:3,mode,grid,tray,score,combo,miss,bombs,undoLeft,snap,over,zone}))}
function newGame(md){mode=md;loadBest();grid=Array(N*N).fill(0);score=0;shown=0;combo=0;miss=0;bombs=[0,0,0];armed=-1;zone=0;undoLeft=UNDOS;snap=null;over=false;active=true;
  buildTex();newTray();['over','home','menu'].forEach(id=>$(id).classList.remove('on'));actEl.classList.remove('need');
  render();renderTray();renderBombs();renderUndo();zoneUI();scoreEl.textContent=0;bestEl.textContent=best;save()}
function render(morph){cells.forEach((d,i)=>{d.className='c';if(grid[i]){d.classList.add('f','t'+grid[i]);if(morph){void d.offsetWidth;d.classList.add('morph')}}})}
function pieceHTML(p){const sh=SHAPES[p.s];let h='';const s=new Set(sh.cells.map(([a,b])=>a+','+b));
  for(let r=0;r<sh.h;r++)for(let c=0;c<sh.w;c++)h+=s.has(r+','+c)?`<div class="b t${p.k}"></div>`:'<div class="b e"></div>';
  return `<div class="pc" style="grid-template-columns:repeat(${sh.w},auto)">${h}</div>`}
function renderTray(){slots.forEach((s,i)=>{const p=tray[i];s.classList.remove('drag');s.innerHTML=p?pieceHTML(p):'';s.classList.toggle('no',!!p&&!fitsAny(SHAPES[p.s]))})}
function setScore(){bestEl.textContent=best;
  const step=()=>{if(shown<score){shown+=Math.max(1,Math.ceil((score-shown)/6));if(shown>score)shown=score;scoreEl.textContent=shown;requestAnimationFrame(step)}};
  if(shown>score){shown=score;scoreEl.textContent=score}else step();
  scoreEl.classList.add('bump');setTimeout(()=>scoreEl.classList.remove('bump'),150);checkZone()}
function linesFor(){const rows=[],cols=[];
  for(let r=0;r<N;r++){let ok=true;for(let c=0;c<N;c++)if(!grid[r*N+c]){ok=false;break}if(ok)rows.push(r)}
  for(let c=0;c<N;c++){let ok=true;for(let r=0;r<N;r++)if(!grid[r*N+c]){ok=false;break}if(ok)cols.push(c)}
  return{rows,cols}}
function clearPreview(){cells.forEach((d,i)=>{if(d.classList.contains('g')||d.classList.contains('h')){d.className='c';if(grid[i])d.classList.add('f','t'+grid[i])}})}
function preview(p,r,c){clearPreview();const sh=SHAPES[p.s];if(!fits(sh,r,c))return false;
  for(const[a,b]of sh.cells)cells[(r+a)*N+c+b].className='c g t'+p.k;
  const tmp=grid.slice();for(const[a,b]of sh.cells)grid[(r+a)*N+c+b]=p.k;const{rows,cols}=linesFor();grid=tmp;
  const hl=new Set();rows.forEach(r2=>{for(let cc=0;cc<N;cc++)hl.add(r2*N+cc)});cols.forEach(cc=>{for(let r2=0;r2<N;r2++)hl.add(r2*N+cc)});
  hl.forEach(i=>{cells[i].className='c h t'+p.k});return true}
function showMsg(big,pts,why){msgEl.innerHTML=(big?`<div class="big">${big}</div>`:'')+(pts?`<div class="pts">+${pts}</div>`:'')+(why?`<div class="why">${why}</div>`:'')}
function vanish(list,delayFn,scale){const m=mat();list.forEach(([i,k],j)=>{const d=cells[i],go=()=>{const rect=cellRect(i);d.className='c f pop t'+k;burst(m,rect,k,scale);
    d.addEventListener('animationend',()=>{d.className='c';if(grid[i])d.classList.add('f','t'+grid[i])},{once:true})};const t=delayFn?delayFn(i,j):0;
  if(t){d.className='c f t'+k;setTimeout(go,t)}else go()})}
function takeSnap(){snap={grid:grid.slice(),tray:JSON.parse(JSON.stringify(tray)),score,combo,miss,bombs:bombs.slice(),zone}}
function renderUndo(){$('undoN').textContent=undoLeft;$('undoBtn').classList.toggle('off',!snap||undoLeft<=0)}
function undo(){if(drag)return;if(!snap||undoLeft<=0){play('bad');hintEl.textContent=undoLeft<=0?tr('undoNone'):tr('undoOnly');hintEl.classList.add('warn');return}
  disarm();const s=snap;grid=s.grid;tray=s.tray;score=s.score;shown=score;combo=s.combo;miss=s.miss;bombs=s.bombs;undoLeft--;snap=null;over=false;
  if(mode==='zones'&&s.zone!==zone){zone=s.zone;buildTex()}
  $('over').classList.remove('on');actEl.classList.remove('need');render();renderTray();renderBombs();renderUndo();zoneUI();scoreEl.textContent=score;
  showMsg('↶ '+tr('undo'),'',tr('left',undoLeft));play('undo');save();checkOver()}
function earnBombs(lines,perfect){const got=[];
  if(perfect||lines>=4)got.push([2,perfect?tr('perfect'):tr('linesAt',lines)]);else if(lines===3)got.push([0,tr('linesAt',3)]);
  if(lines&&combo>=5&&combo%5===0)got.push([1,tr('whyCombo',combo)]);
  const res=[];for(const[t,why]of got){if(bombs[t]<MAXB){bombs[t]++;res.push([t,why])}}return res}
function place(i,r,c){
  takeSnap();
  const p=tray[i],sh=SHAPES[p.s],m=mat();
  const placed=sh.cells.map(([a,b])=>(r+a)*N+c+b);placed.forEach(k=>grid[k]=p.k);
  let gain=sh.cells.length;
  const{rows,cols}=linesFor();const lines=rows.length+cols.length;const cleared=new Map();
  rows.forEach(r2=>{for(let cc=0;cc<N;cc++)cleared.set(r2*N+cc,grid[r2*N+cc])});
  cols.forEach(cc=>{for(let r2=0;r2<N;r2++)cleared.set(r2*N+cc,grid[r2*N+cc])});
  if(lines){combo++;miss=0;gain+=lines*10*lines+(combo-1)*10*lines;cleared.forEach((_,k)=>grid[k]=0)}
  else if(++miss>=3)combo=0;
  const perfect=lines>0&&grid.every(v=>!v);if(perfect)gain+=300;
  score+=gain;if(score>best){best=score;ls.set(bestKey(),best)}
  tray[i]=null;if(tray.every(x=>!x))newTray();
  clearPreview();render();
  placed.forEach(k=>{if(grid[k]){cells[k].classList.add('land');landFx(m,cellRect(k),p.k)}});
  if(lines){const pr=r+sh.h/2,pc2=c+sh.w/2,pcol2=pcol(p.k);
    beams(rows,cols,pcol2);
    vanish([...cleared],(k)=>60+Math.hypot(Math.floor(k/N)-pr,k%N-pc2)*30,cleared.size>24?.5:1);
    if(lines>=2){flash(Math.min(.45,.12*lines),.35);shake(3+lines*2)}
    playMat(true);if(combo>1)play('combo',combo);
    const words=['',...tr('words')];
    showMsg(perfect?tr('clean'):combo>1?tr('combo',combo):words[Math.min(lines,5)],gain)}
  else playMat(false);
  const gifts=earnBombs(lines,perfect);
  if(gifts.length)setTimeout(()=>{gifts.forEach(([t])=>{const b=bombsEl.children[t];renderBombs();const nb=bombsEl.children[t];if(nb)nb.classList.add('got')});
    play('gift');showMsg('+ '+gifts.map(([q])=>bName(q)).join(', ')+'!','',gifts.map(g=>g[1]).join(' · '))},lines?650:0);
  setScore();renderTray();renderBombs();renderUndo();save();checkOver()}
function gameOver(){over=true;$('fs').textContent=score;$('fb').textContent=best;
  $('nb').style.display=score>0&&score>=best?'block':'none';
  const ub=$('overUndo');ub.style.display=snap&&undoLeft>0?'block':'none';ub.textContent=tr('undoN',undoLeft);
  $('over').classList.add('on');save();play('over')}
function checkOver(){
  if(tray.some(p=>p&&fitsAny(SHAPES[p.s]))){if(actEl.classList.contains('need')){actEl.classList.remove('need');renderBombs()}return}
  if(bombs.some(b=>b>0)||(snap&&undoLeft>0)){actEl.classList.add('need');hintEl.textContent=bombs.some(b=>b>0)?tr('noSpaceB'):tr('noSpaceU');hintEl.classList.add('warn');
    if(!bombs.some(b=>b>0))setTimeout(()=>{if(!tray.some(p=>p&&fitsAny(SHAPES[p.s]))&&!over)gameOver()},900)}
  else setTimeout(gameOver,700)}

bombsEl.addEventListener('click',e=>{const b=e.target.closest('.bm');if(!b||drag)return;audio();const t=+b.dataset.b;
  if(!bombs[t]){play('bad');hintEl.textContent=tr('noBomb');hintEl.classList.add('warn');return}
  armed=armed===t?-1:t;clearX();if(armed>=0)play('arm');renderBombs()});
function bombArea(t,r,c){const out=[];
  if(t===0){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const r2=r+a,c2=c+b;if(r2>=0&&c2>=0&&r2<N&&c2<N)out.push(r2*N+c2)}}
  else if(t===1){for(let k=0;k<N;k++){out.push(r*N+k);if(k!==r)out.push(k*N+c)}}
  else{const k=grid[r*N+c];if(k)grid.forEach((v,i)=>{if(v===k)out.push(i)})}
  return out}
function clearX(){cells.forEach(d=>d.classList.remove('x'))}
function cellAt(e){const m=metrics(),c=Math.floor((e.clientX-m.x+(m.pitch-m.size)/2)/m.pitch),r=Math.floor((e.clientY-m.y+(m.pitch-m.size)/2)/m.pitch);
  return r>=0&&c>=0&&r<N&&c<N?[r,c]:null}
function bombHover(e){clearX();const rc=cellAt(e);if(!rc)return;bombArea(armed,rc[0],rc[1]).forEach(i=>cells[i].classList.add('x'))}
function detonate(t,r,c){
  const area=bombArea(t,r,c),hit=area.filter(i=>grid[i]);
  if(!hit.length){play('bad');return}
  takeSnap();bombs[t]--;armed=-1;
  const list=hit.map(i=>[i,grid[i]]);hit.forEach(i=>grid[i]=0);
  const gain=hit.length*2;score+=gain;if(score>best){best=score;ls.set(bestKey(),best)}
  clearX();render();
  const center=cellRect(r*N+c),m=metrics(),cx=center.left+center.width/2,cy=center.top+center.height/2;
  if(t===0){explode3(center);vanish(list,null,1.3);play('boom');setTimeout(()=>playMat(true),120)}
  else if(t===1){const speed=m.pitch*20;addP({s:'glow',x:cx,y:cy,vx:0,vy:0,z:m.size*3,c:'#ff9a30',g:0,rot:0,max:.4});flash(.3,.3);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const steps=dx>0?N-1-c:dx<0?c:dy>0?N-1-r:r;
      addP({s:'rocket',x:cx,y:cy,vx:dx*speed,vy:dy*speed,rot:Math.atan2(dy,dx),vr:0,g:0,z:m.size*.55,max:(steps+.6)*m.pitch/speed,
        emit:(p,dt)=>{p.acc=(p.acc||0)+dt;while(p.acc>.012){p.acc-=.012;addP({s:'fire',x:p.x-dx*m.size*.4,y:p.y-dy*m.size*.4,vx:(R()-.5)*50,vy:(R()-.5)*50,z:m.size*.25,g:0,drag:4,max:.3})}}})});
    vanish(list,i=>Math.max(Math.abs(Math.floor(i/N)-r),Math.abs(i%N-c))*m.pitch/speed*1000+20,.9);
    play('whoosh');setTimeout(()=>playMat(true),180);shake(7)}
  else{const pal=PALS[set.pal].c,col=pcol(list[0][1]);addP({s:'glow',x:cx,y:cy,vx:0,vy:0,z:m.size*4,c:col,g:0,rot:0,max:.6});
    for(let i=0;i<(RM?6:22);i++){const a=R()*7,v=120+R()*300;addP({s:'spark',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,z:m.size*.3,c:pal[i%8],g:0,drag:2,max:.8})}
    addP({s:'ring',x:cx,y:cy,vx:0,vy:0,z:m.size*5,c:'rgba(255,255,255,.9)',g:0,max:.5});
    list.forEach(([i],j)=>setTimeout(()=>{const rc=cellRect(i);addP({s:'bolt',x:cx,y:cy,dx:rc.left+rc.width/2-cx,dy:rc.top+rc.height/2-cy,c:col,g:0,vx:0,vy:0,rot:0,vr:0,max:.32})},j*28));
    vanish(list,(i,j)=>140+j*28,1);play('magic');setTimeout(()=>playMat(true),200);flash(.25,.4);shake(5)}
  showMsg(tr('boom'),gain);actEl.classList.remove('need');renderBombs();renderUndo();setScore();renderTray();save();checkOver()}
let bp=false;
boardEl.addEventListener('pointerdown',e=>{if(armed<0)return;e.preventDefault();bp=true;try{boardEl.setPointerCapture(e.pointerId)}catch(_){}bombHover(e)});
boardEl.addEventListener('pointermove',e=>{if(armed<0)return;if(e.pointerType==='mouse'||bp)bombHover(e)});
boardEl.addEventListener('pointerup',e=>{if(armed<0||!bp)return;bp=false;const rc=cellAt(e);clearX();if(rc)detonate(armed,rc[0],rc[1])});
boardEl.addEventListener('pointercancel',()=>{bp=false;clearX()});
boardEl.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!bp)clearX()});
$('undoBtn').addEventListener('click',()=>{audio();undo()});

/* ---------- drag ---------- */
let drag=null;
trayEl.addEventListener('pointerdown',e=>{
  const s=e.target.closest('.slot');if(!s||drag||over)return;const i=+s.dataset.i,p=tray[i];if(!p)return;disarm();
  e.preventDefault();audio();updateMusicOnce();play('pick');
  const m=metrics(),sh=SHAPES[p.s];
  const f=document.createElement('div');f.className='float';f.style.gridTemplateColumns=`repeat(${sh.w},${m.size}px)`;f.style.gap=(m.pitch-m.size)+'px';
  const ss=new Set(sh.cells.map(([a,b])=>a+','+b));let h='';
  for(let r=0;r<sh.h;r++)for(let c=0;c<sh.w;c++)h+=ss.has(r+','+c)?`<div class="b t${p.k}" style="width:${m.size}px;height:${m.size}px"></div>`:`<div style="width:${m.size}px;height:${m.size}px"></div>`;
  f.innerHTML=h;document.body.appendChild(f);s.classList.add('drag');
  const w=sh.w*m.pitch-(m.pitch-m.size),hh=sh.h*m.pitch-(m.pitch-m.size);
  const lift=e.pointerType==='mouse'?0:hh/2+m.pitch*1.2;
  drag={i,p,f,m,w,h:hh,lift,slot:s,r:-99,c:-99,ok:false};
  try{trayEl.setPointerCapture(e.pointerId)}catch(_){}
  move(e)});
function move(e){if(!drag)return;const d=drag,x=e.clientX-d.w/2,y=e.clientY-d.lift-d.h/2;
  d.f.style.transform=`translate(${x}px,${y}px)`;
  const c=Math.round((x-d.m.x)/d.m.pitch),r=Math.round((y-d.m.y)/d.m.pitch);
  if(r!==d.r||c!==d.c){d.r=r;d.c=c;d.ok=preview(d.p,r,c)}}
trayEl.addEventListener('pointermove',move);
function end(){if(!drag)return;const d=drag;drag=null;
  if(d.ok){d.f.remove();place(d.i,d.r,d.c)}
  else{clearPreview();const sr=d.slot.getBoundingClientRect();d.f.classList.add('back');
    if(d.r>-3&&d.r<N+1&&d.c>-3&&d.c<N+1)play('bad');
    d.f.style.transform=`translate(${sr.left+sr.width/2-d.w/2}px,${sr.top+sr.height/2-d.h/2}px) scale(.54)`;
    setTimeout(()=>{d.f.remove();d.slot.classList.remove('drag')},200)}}
trayEl.addEventListener('pointerup',end);trayEl.addEventListener('pointercancel',end);
let musStarted=false;function updateMusicOnce(){if(!musStarted){musStarted=true;updateMusic()}}

/* ---------- rules ---------- */
function buildRules(){const z=`<table><tr><th>${tr('zoneCol')}</th><th>${tr('ptsCol')}</th></tr>`+ZMATS.map((m,i)=>`<tr><td>${i+1}. ${mName(m)}</td><td dir="ltr">${zoneStart(i)}–${zoneStart(i+1)-1}</td></tr>`).join('')+'</table>';
  $('rulesBody').innerHTML=tr('rulesHtml')(z,BOMBS.map(b=>b.svg)).replace(/id="(\w+)"/g,'id="r$1"').replace(/url\(#(\w+)\)/g,'url(#r$1)')}

/* ---------- menu & home ---------- */
function buildMenu(){
  $('matOpts').innerHTML=`<button class="opt${set.mat==='auto'?' sel':''}" data-mat="auto"><span class="sw" style="height:36px;background:rgba(0,0,0,.25);font-weight:900;font-size:12px;text-align:center;line-height:1.1">${tr('auto')}</span>${mode==='endless'?mName(MATS[0]):tr('byZone')}</button>`+
    MATS.map((m,i)=>`<button class="opt${set.mat===m.id?' sel':''}" data-mat="${m.id}"><img src="${makeTex(m,(i%8)+1)}" alt="">${mName(m)}</button>`).join('');
  $('themeOpts').innerHTML=Object.entries(THEMES).map(([k,t])=>`<button class="opt${k===set.theme?' sel':''}" data-theme="${k}"><span class="sw" style="background:linear-gradient(135deg,${t.bg1},${t.bg2})"><i style="background:${t.board}"></i><i style="background:${t.slot}"></i></span>${tr('themes')[k]}</button>`).join('');
  $('palOpts').innerHTML=Object.entries(PALS).map(([k,p])=>`<button class="opt${k===set.pal?' sel':''}" data-pal="${k}"><span class="sw" style="background:rgba(0,0,0,.25)">${p.c.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')}</span>${tr('pals')[k]}</button>`).join('');
  $('sndOpts').innerHTML=Object.entries(SNDS).map(([k,s])=>`<button class="opt${k===set.snd?' sel':''}" data-snd="${k}">${tr('snds')[k]}</button>`).join('');
  $('tgSfx').setAttribute('aria-checked',set.sfx);$('tgMus').setAttribute('aria-checked',set.mus);
  $('vol').value=set.vol;$('volTxt').textContent=set.vol+'%';$('menuLangs').innerHTML=langBtns()}
function refreshAll(morph){applyTheme();buildTex();render(morph);renderTray();zoneUI();buildMenu();saveSet()}
$('menu').addEventListener('click',e=>{
  const b=e.target.closest('button');if(e.target===$('menu')){$('menu').classList.remove('on');return}if(!b)return;audio();
  if(b.dataset.mat){set.mat=b.dataset.mat;refreshAll(true);playMat(true)}
  else if(b.dataset.theme){set.theme=b.dataset.theme;refreshAll();play('pick')}
  else if(b.dataset.pal){set.pal=b.dataset.pal;refreshAll(true);play('pick')}
  else if(b.dataset.snd){set.snd=b.dataset.snd;refreshAll();play('gift')}
  else if(b.id==='tgSfx'){set.sfx=!set.sfx;refreshAll();play('pick')}
  else if(b.id==='tgMus'){set.mus=!set.mus;musStarted=true;refreshAll();updateMusic()}
  else if(b.id==='closeMenu'){$('menu').classList.remove('on')}
  else if(b.id==='menuRules'){$('menu').classList.remove('on');openRules()}
  else if(b.id==='newFromMenu'){$('menu').classList.remove('on');openHome()}});
$('vol').addEventListener('input',e=>{set.vol=+e.target.value;$('volTxt').textContent=set.vol+'%';audio();applyVol();saveSet()});
$('vol').addEventListener('change',()=>playMat(false));
$('menuBtn').addEventListener('click',()=>{audio();disarm();buildMenu();$('menu').classList.add('on')});
function openRules(){buildRules();$('rules').classList.add('on');$('rules').querySelector('.card').scrollTop=0}
$('helpBtn').addEventListener('click',()=>{audio();openRules()});
$('closeRules').addEventListener('click',()=>$('rules').classList.remove('on'));
$('rules').addEventListener('click',e=>{if(e.target===$('rules'))$('rules').classList.remove('on')});
function openHome(){const logoM=MATS[0];$('logo').innerHTML=[1,2,3,4,5].map(k=>`<img src="${makeTex(logoM,k)}" alt="">`).join('');
  $('contBtn').style.display=active&&!over?'block':'none';$('home').classList.add('on')}
$('home').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audio();updateMusicOnce();
  if(b.dataset.mode){newGame(b.dataset.mode);play('zone')}
  else if(b.id==='contBtn')$('home').classList.remove('on');
  else if(b.id==='homeRules')openRules()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('menu').classList.remove('on');$('rules').classList.remove('on');disarm()}});
$('again').addEventListener('click',()=>{audio();newGame(mode)});
$('overUndo').addEventListener('click',()=>{audio();undo()});
$('overHome').addEventListener('click',()=>{$('over').classList.remove('on');openHome()});

/* ---------- language ---------- */
function langBtns(){return Object.entries(LANGS).map(([k,n])=>`<button class="opt${k===set.lang?' sel':''}" data-lang="${k}">${n}</button>`).join('')}
function applyLang(){const h=document.documentElement;h.lang=set.lang;h.dir=set.lang==='fa'?'rtl':'ltr';
  const T=(id,k,...a)=>{const e=$(id);if(e)e.textContent=tr(k,...a)};
  T('tagline','tagline');T('contBtn','cont');T('homeRules','rulesBtn');T('rulesTitle','rules');T('closeRules','gotIt');
  $('mZones').innerHTML=`${tr('zones')}<small>${tr('zonesSub')}</small>`;$('mEndless').innerHTML=`${tr('endless')}<small>${tr('endlessSub')}</small>`;
  T('overTitle','over');T('lblScore','score');T('lblBest','best');T('nb','newBest');T('again','again');T('overHome','chooseMode');
  T('menuTitle','menu');T('hLang','lang');T('hBlocks','blocks');T('hBg','bg');T('hCol','bcol');T('hSound','sound');T('lSfx','sfx');T('lMus','music');T('lVol','vol');T('hUi','uisnd');
  T('closeMenu','done');T('menuRules','rules');T('newFromMenu','newGame');$('undoBtn').setAttribute('aria-label',tr('undo'));$('helpBtn').setAttribute('aria-label',tr('rules'));$('menuBtn').setAttribute('aria-label',tr('menu'));
  $('homeLangs').innerHTML=langBtns();$('menuLangs').innerHTML=langBtns();
  zoneUI();renderBombs();if($('menu').classList.contains('on'))buildMenu();if($('rules').classList.contains('on'))buildRules();
  if($('over').classList.contains('on'))$('overUndo').textContent=tr('undoN',undoLeft)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;set.lang=b.dataset.lang;saveSet();applyLang();play('pick')});
function runSplash(){const sp=$('splash');if(!sp)return;const e=$('spE'),img=e.querySelector('img');e.style.setProperty('--m',`url(${img.src})`);
  for(let i=0;i<18;i++){const d=document.createElement('i'),a=i/18*Math.PI*2+R()*.3,r=110+R()*110,w=5+R()*9;d.className='sp-dot';
    d.style.cssText=`width:${w}px;height:${w}px;background:${i%3?'#ffab20':'#ffffff'};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;animation-delay:${.32+R()*.3}s`;e.appendChild(d)}
  const done=()=>{if(sp.classList.contains('out'))return;sp.classList.add('out');setTimeout(()=>sp.remove(),500)};
  setTimeout(done,RM?900:2300);sp.addEventListener('click',done)}

/* ---------- start ---------- */
applyTheme();runSplash();
let st=null;try{st=JSON.parse(ls.get('bp_state')||'null')}catch(_){}
if(st&&st.v===3&&Array.isArray(st.grid)&&st.grid.length===N*N){
  mode=st.mode==='endless'?'endless':'zones';loadBest();grid=st.grid;tray=st.tray;score=st.score|0;shown=score;combo=st.combo|0;miss=st.miss|0;
  bombs=Array.isArray(st.bombs)?st.bombs.map(n=>Math.min(MAXB,n|0)):[0,0,0];undoLeft=st.undoLeft??UNDOS;snap=st.snap||null;over=!!st.over;zone=mode==='zones'?zoneOfScore(score):0;active=true;
  buildTex();if(!Array.isArray(tray)||tray.every(x=>!x))newTray();render();renderTray();renderBombs();renderUndo();zoneUI();scoreEl.textContent=score;bestEl.textContent=best;
  if(over)gameOver();else checkOver();
}else{mode='zones';loadBest();const ob=+ls.get('bp_best')||0;best=ob;buildTex();newTray();render();renderTray();renderBombs();renderUndo();zoneUI();bestEl.textContent=best;openHome()}
applyLang();
}
</script>
</body>
