plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'tj.bikhon.blokpuzzle'
    compileSdk 34

    defaultConfig {
        applicationId 'tj.bikhon.blokpuzzle'
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('blok.keystore')
            storePassword 'blokpuzzle'
            keyAlias 'blok'
            keyPassword 'blokpuzzle'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
