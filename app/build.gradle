plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

// Калиди махфӣ барои Google Play аз GitHub Secrets меояд.
// Агар он набошад, калиди санҷишии blok.keystore истифода мешавад (танҳо барои APK-и санҷишӣ).
def uploadStore = System.getenv('UPLOAD_KEYSTORE_FILE')
def usePlayKey = uploadStore != null && file(uploadStore).exists()

android {
    namespace 'tj.bikhon.blockbikhon'
    compileSdk 36

    defaultConfig {
        applicationId 'tj.bikhon.blockbikhon'
        minSdk 23
        targetSdk 36
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    signingConfigs {
        release {
            if (usePlayKey) {
                storeFile file(uploadStore)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
            } else {
                storeFile file('blok.keystore')
                storePassword 'blokpuzzle'
                keyAlias 'blok'
                keyPassword 'blokpuzzle'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
