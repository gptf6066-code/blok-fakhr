plugins {
    id 'com.android.application'
}

android {
    namespace 'tj.bikhon.blokpuzzle'
    compileSdk 34

    defaultConfig {
        applicationId 'tj.bikhon.blokpuzzle'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        release {
            storeFile file('blok.keystore')
            storePassword 'blokpuzzle'
            keyAlias 'blok'
            keyPassword 'blokpuzzle'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
